---

- name: Add docker cron MAILTO
  ansible.builtin.cron:
    cron_file: docker
    user: root
    name: MAILTO
    env: true
    value: "{{ admin_addr_to }}"
  become: true
  when: admin_addr_to is defined

- name: Add docker cron MAILFROM
  ansible.builtin.cron:
    cron_file: docker
    user: root
    name: MAILFROM
    env: true
    value: "{{ admin_addr_from }}"
  become: true
  when: admin_addr_from is defined

- name: Remove legacy docker soft-cleanup cron
  ansible.builtin.cron:
    cron_file: docker
    user: root
    name: docker soft-cleanup
    state: absent
  become: true

- name: Remove legacy docker hard-cleanup cron
  ansible.builtin.cron:
    cron_file: docker
    user: root
    name: docker hard-cleanup
    state: absent
  become: true

# Everything except volumes, and only items older than 8 days (192h) so that
# weekly re-builds don't re-download images/layers that are still in rotation.
- name: Add docker cron system-cleanup
  ansible.builtin.cron:
    cron_file: docker
    user: root
    name: docker system-cleanup
    minute: '0'
    hour: '0'
    job: docker system prune --all --force --filter "until=192h" --filter "label!=keepme" > /dev/null
  become: true

# Anonymous volumes can't be age-filtered by docker natively, so a helper
# script removes only detached, unlabelled anonymous volumes older than 1h.
- name: Install docker-anon-volume-prune helper
  ansible.builtin.copy:
    src: docker-anon-volume-prune.sh
    dest: /usr/local/bin/docker-anon-volume-prune
    mode: '0755'
  become: true

- name: Add docker cron volume-cleanup
  ansible.builtin.cron:
    cron_file: docker
    user: root
    name: docker volume-cleanup
    minute: '30'
    hour: '0'
    job: /usr/local/bin/docker-anon-volume-prune > /dev/null
  become: true

- name: Restart unhealthy containers
  ansible.builtin.cron:
    cron_file: docker
    user: root
    name: docker unhealthy-restart
    minute: '*/2'
    job: docker ps -q -f health=unhealthy | xargs --no-run-if-empty docker restart
  become: true
  when: dockerd_restart_unhealthy | default(false) | bool
